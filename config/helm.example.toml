# Engine + bots. Secrets never go here (SEC-2): the loader rejects secret-looking keys.
[engine]
data_dir        = "data"
log_level       = "INFO"
starting_equity = 10000
# heartbeat_url = "https://hc-ping.com/<uuid>"   # OPS-3 dead-man's switch (optional)

[[engine.bots]]
id         = "sma-btc"
strategy   = "helm.strategy.examples.sma_cross:SmaCross"
mode       = "paper"            # live also needs HELM_LIVE_TRADING=1 and lifecycle >= LIVE_SMALL (EXE-1)
account_id = "paper-main"
venue      = "fake"
symbols    = ["fake:BTC/USD"]
timeframe  = "1m"
lifecycle  = "DRAFT"
params     = { fast = 10, slow = 30, qty = 0.01 }
